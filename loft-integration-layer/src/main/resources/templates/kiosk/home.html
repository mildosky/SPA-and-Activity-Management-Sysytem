<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Loft Kiosk</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
        .header { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: white; font-size: 1.5rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .welcome { text-align: center; color: white; margin-bottom: 2rem; }
        .welcome h2 { font-size: 2rem; margin-bottom: 0.5rem; }
        .welcome p { opacity: 0.9; }
        .activities-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .activity-card { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
        .activity-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        .activity-card h3 { color: #667eea; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .activity-card .category { display: inline-block; background: #f0f0f0; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; color: #666; margin-bottom: 1rem; }
        .activity-card .details { color: #666; margin-bottom: 1.5rem; }
        .activity-card .price { font-size: 1.5rem; font-weight: 700; color: #764ba2; }
        .btn { display: inline-block; padding: 1rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 600; transition: all 0.2s; border: none; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: scale(1.05); }
        .reset-btn { background: rgba(255,255,255,0.2); color: white; padding: 0.75rem 1.5rem; }
        .reset-btn:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏨 Loft Kiosk</h1>
        <a href="/kiosk/reset" class="btn reset-btn">Start Over</a>
    </div>
    
    <div class="container">
        <div class="welcome">
            <h2>Welcome to Loft</h2>
            <p>Select a treatment or activity to book</p>
        </div>
        
        <div class="activities-grid">
            <div class="activity-card" th:each="activity : ${activities}" 
                 th:onclick="'window.location.href=\'/kiosk/activity/' + ${activity.id} + '\''">
                <span class="category" th:text="${activity.category}">SPA</span>
                <h3 th:text="${activity.name}">60-Minute Massage</h3>
                <div class="details">
                    <span th:text="${activity.defaultDurationMinutes} + ' minutes'">60 minutes</span>
                </div>
                <div class="price" th:text="${activity.price} + ' ' + ${activity.currency}">$100.00 USD</div>
            </div>
            
            <div th:if="${#lists.isEmpty(activities)}" style="grid-column: 1/-1; text-align: center; color: white; padding: 3rem;">
                <p style="font-size: 1.2rem;">No activities available at the moment.</p>
                <p>Please check back later or contact reception.</p>
            </div>
        </div>
    </div>
</body>
</html>
